<nav class="bg-surface/80 backdrop-blur-md sticky top-0 z-50 border-b border-black/5">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-20 items-center">
            <!-- Logo -->
            <a routerLink="/customer" class="flex items-center gap-2">
                <div class="w-10 h-10 bg-primary rounded-xl flex items-center justify-center">
                    <span class="material-icons text-surface">local_cafe</span>
                </div>
                <span class="text-2xl font-display font-bold text-primary">Brew & Bite</span>
            </a>

            <!-- Desktop Menu -->
            <div class="hidden md:flex items-center gap-8">
                <a routerLink="/customer" routerLinkActive="text-primary" [routerLinkActiveOptions]="{exact: true}"
                    class="text-primary/60 hover:text-primary transition-colors">
                    Home
                </a>
                <a routerLink="/customer/menu" routerLinkActive="text-primary"
                    class="text-primary/60 hover:text-primary transition-colors">
                    Menu
                </a>
                <a routerLink="/customer/orders" routerLinkActive="text-primary"
                    class="text-primary/60 hover:text-primary transition-colors">
                    Orders
                </a>
            </div>

            <!-- Actions -->
            <div class="flex items-center gap-4">
                <a routerLink="/customer/cart"
                    class="relative p-2 text-primary/80 hover:text-primary transition-colors">
                    <span class="material-icons">shopping_cart</span>
                    @if (cartCount() > 0) {
                    <span
                        class="absolute top-0 right-0 bg-primary text-surface text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center border-2 border-surface">
                        {{ cartCount() }}
                    </span>
                    }
                </a>
                <a routerLink="/customer/profile" class="p-2 text-primary/80 hover:text-primary transition-colors">
                    <span class="material-icons">person</span>
                </a>

                <!-- Mobile Menu Toggle -->
                <button class="md:hidden p-2 text-primary/80" (click)="toggleMobileMenu()">
                    <span class="material-icons">{{ isMobileMenuOpen() ? 'close' : 'menu' }}</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Mobile Menu -->
    @if (isMobileMenuOpen()) {
    <div class="md:hidden bg-surface border-b border-black/5">
        <div class="px-4 pt-2 pb-6 space-y-2">
            <a routerLink="/customer" (click)="closeMobileMenu()"
                class="block px-4 py-3 rounded-xl hover:bg-secondary/20 font-medium">Home</a>
            <a routerLink="/customer/menu" (click)="closeMobileMenu()"
                class="block px-4 py-3 rounded-xl hover:bg-secondary/20 font-medium">Menu</a>
            <a routerLink="/customer/orders" (click)="closeMobileMenu()"
                class="block px-4 py-3 rounded-xl hover:bg-secondary/20 font-medium">Orders</a>
        </div>
    </div>
    }
</nav>
