<div class="bg min-h-[80vh] flex items-center justify-center px-4 py-12">
      <div class="max-w-md w-full space-y-12 animate-in fade-in zoom-in-95 duration-700">
        <div class="text-center space-y-4">
          <div class="w-20 h-20 bg-primary rounded-3xl flex items-center justify-center mx-auto shadow-xl shadow-primary/20">
          </div>
          <h1 class="text-4xl font-display font-bold">Welcome Back</h1>
          <p class="text-primary/60">Sign in to your account to continue ordering.</p>
        </div>

        <form class="space-y-6">
          <div class="space-y-2">
            <label for="email" class="text-sm font-bold text-primary/60 ml-1">Email Address</label>
            <input id="email" type="email" placeholder="name@example.com" class="input-field">
          </div>
          
          <div class="space-y-2">
            <div class="flex justify-between items-center ml-1">
              <label for="password" class="text-sm font-bold text-primary/60">Password</label>
              <a href="#" class="text-xs font-bold text-primary hover:underline">Forgot password?</a>
            </div>
            <input id="password" type="password" placeholder="••••••••" class="input-field">
          </div>

          <button type="button" class="btn-primary w-full py-4 text-lg shadow-lg shadow-primary/20">
            Sign In
          </button>
        </form>

        <div class="relative py-4">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-black/5"></div>
          </div>
        </div>


        <p class="text-center text-sm text-primary/60">
          Don't have an account? 
          <a routerLink="/register" class="font-bold text-primary hover:underline">Sign up for free</a>
        </p>
      </div>
    </div>
