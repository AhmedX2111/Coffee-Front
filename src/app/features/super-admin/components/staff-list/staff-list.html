<main class="p-8 bg-[#F8F8F8] min-h-screen">
  <div class="max-w-6xl mx-auto space-y-6">
    <app-head-staff></app-head-staff>
    <div class="bg-white rounded-[32px] shadow-sm border border-gray-100 overflow-hidden mt-5">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="text-xs font-bold text-gray-400 uppercase tracking-wider">
            <th class="px-8 py-6">User</th>
            <th class="px-8 py-6">Role</th>
            <th class="px-8 py-6">Branch</th>
            <th class="px-8 py-6 text-right">Actions</th>
          </tr>
        </thead>

        <tbody class="divide-y divide-gray-50">
          @for (user of staffMembers(); track user.userId) {
            <tr class="hover:bg-gray-50/50 transition-colors group">
              <td class="px-8 py-5">
                <div class="flex items-center gap-4">
                  <div class="w-12 h-12 rounded-2xl bg-[#F3EDE7] flex items-center justify-center font-bold text-[#2D1B0D] text-sm shadow-sm">
                    {{user.initials}}
                  </div>
                  <div>
                    <p class="font-bold text-[#2D1B0D]">{{ user.userName }}</p>
                    <p class="text-sm text-gray-400">{{ user.email }}</p>
                  </div>
                </div>
              </td>

              <td class="px-8 py-5">
                <span 
                  class="px-3 py-1 rounded-lg text-[10px] font-black uppercase tracking-widest shadow-sm"
                  [ngClass]="{
                    'bg-purple-100 text-purple-600': user.role_name === 'ADMIN',
                    'bg-blue-100 text-blue-600': user.role_name === 'MANAGER'
                  }">
                  {{ user.role_name }}
                </span>
              </td>

              <td class="px-8 py-5">
                @if (user.branchName) {
                  <div class="flex items-center gap-2 text-gray-500">
                    <span class="material-icons text-sm">storefront</span>
                    <span class="text-sm font-medium">{{ user.branchName }}</span>
                  </div>
                } @else {
                  <span class="text-sm text-gray-300 italic">Not assigned</span>
                }
              </td>

              <td class="px-8 py-5 text-right">
                <div class="flex justify-end gap-2">
                  <button class="p-2 text-gray-400 hover:text-[#2D1B0D] hover:bg-white rounded-lg transition-all border border-transparent hover:border-gray-100">
                    <span class="material-icons text-xl">edit_note</span>
                  </button>
                  <button class="p-2 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-all">
                    <span class="material-icons text-xl">delete_outline</span>
                  </button>
                </div>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</main>
