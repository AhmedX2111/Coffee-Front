<main class="p-4 md:p-6 lg:p-8 bg-[#F8F8F8] min-h-screen flex flex-col gap-6">

  <app-search-branches-order 
    [branches]="branches()"
    (branchChanged)="onBranchChange($event)"
    (searchChanged)="onSearch($event)">
  </app-search-branches-order>
 <app-date-filter (dateChanged)="onDateChange($event)"></app-date-filter>
  <div class="bg-white rounded-[24px] shadow-sm border border-gray-100 overflow-x-auto">
    <table class="w-full text-left border-collapse min-w-[700px]">
      <thead>
        <tr class="text-xs font-bold text-gray-400 uppercase tracking-widest">
          <th class="px-4 md:px-6 lg:px-8 py-4 md:py-5">Order ID</th>
          <th class="px-4 md:px-6 lg:px-8 py-4 md:py-5">Customer</th>
          <th class="px-4 md:px-6 lg:px-8 py-4 md:py-5">Branch</th>
          <th class="px-4 md:px-6 lg:px-8 py-4 md:py-5">Total</th>
          <th class="px-4 md:px-6 lg:px-8 py-4 md:py-5 text-center">Status</th>
          <th class="px-4 md:px-6 lg:px-8 py-4 md:py-5 text-center">Type</th>
          <th class="px-4 md:px-6 lg:px-8 py-4 md:py-5">Date</th>
         </tr>
      </thead>
      <tbody class="divide-y divide-gray-50">
        @for(order of orders(); track order.orderNumber) {
          <tr class="hover:bg-gray-50/50 transition-colors">
            <td class="px-4 md:px-6 lg:px-8 py-4 md:py-5 font-bold text-[#2D1B0D] text-sm">
              {{ order.orderNumber }}
            </td>
            <td class="px-4 md:px-6 lg:px-8 py-4 md:py-5 font-bold text-[#2D1B0D]">
              {{ order.userName }}
            </td>
            <td class="px-4 md:px-6 lg:px-8 py-4 md:py-5 text-gray-400 font-medium">
              {{ order.branchName }}
            </td>
            <td class="px-4 md:px-6 lg:px-8 py-4 md:py-5 font-bold text-[#2D1B0D]">
              {{ order.totalPrice }} EGP
            </td>
            <td class="px-4 md:px-6 lg:px-8 py-4 md:py-5 text-center">
              <span class="px-3 py-1 rounded-lg text-[10px] font-black uppercase tracking-wider"
                    [ngClass]="{
                      'bg-green-100 text-green-600': order.status === 'COMPLETED',
                      'bg-orange-100 text-orange-600': order.status === 'PENDING',
                      'bg-red-100 text-red-600': order.status === 'CANCELLED'
                    }">
                {{ order.status }}
              </span>
            </td>
            <td class="px-4 md:px-6 lg:px-8 py-4 md:py-5 text-center">
              {{ order.type }}
            </td>
            <td class="px-4 md:px-6 lg:px-8 py-4 md:py-5 text-gray-400 text-sm font-medium">
              {{ order.createdAt | date:'short' }}
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="7" class="text-center py-12 text-gray-500">
              No orders found.
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>

   <app-pagination
    [currentPage]="currentPage()"
    [totalPages]="totalPages()"
    [totalElements]="totalElements()"
    [itemsCount]="orders().length"
    (prev)="prevPage()"
    (next)="nextPage()"
    (goToPage)="goToPage($event)">
  </app-pagination>

</main>
