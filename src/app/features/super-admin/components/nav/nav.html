<header class="bg-white border-b border-gray-100 px-8 py-3 flex flex-col gap-4">
      <div class="flex justify-between items-center">
        <div class="flex-1 text-center font-semibold text-gray-700">BrewMaster Admin</div>
        <div class="flex items-center gap-4 text-gray-500">
          <button class="flex items-center gap-2 px-3 py-1 border rounded-lg text-sm">
            <i class="ph-arrows-clockwise"></i> Remix
          </button>
          <button class="flex items-center gap-2 px-3 py-1 border rounded-lg text-sm">
            <i class="ph-monitor"></i> Device
          </button>
          <i class="ph-corners-out cursor-pointer"></i>
        </div>
      </div>

      <div class="flex justify-between items-center">
        <div class="relative w-96">
          <i class="ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
          <input type="text" placeholder="Search anything..." 
                 class="w-full pl-10 pr-4 py-2 bg-gray-50 border-none rounded-full text-sm focus:ring-1 focus:ring-[#2D1B0D]">
        </div>
        <div class="flex items-center gap-6">
          <i class="ph-bell text-xl text-gray-400 cursor-pointer"></i>
          <span class="text-sm font-medium text-gray-600">{{date | date:'fullDate'}}</span>
        </div>
      </div>
    </header>
