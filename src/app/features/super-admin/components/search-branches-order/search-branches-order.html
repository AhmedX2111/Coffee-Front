<div class="flex flex-col gap-4 md:gap-6 mb-6">
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl md:text-3xl font-bold text-[#2D1B0D]">
        Order History
      </h1>
      <p class="text-gray-500 mt-1 text-sm md:text-base">
        View and manage orders across all branches.
      </p>
    </div>
    <div class="flex flex-col sm:flex-row w-full md:w-auto gap-3">
      <div class="relative w-full sm:w-auto flex-1">
        <input type="text"
               (input)="onSearch($event)"
               placeholder="Search orders..."
               class="w-full sm:w-64 pl-4 pr-4 py-2.5 bg-white border border-gray-100 rounded-xl shadow-sm
                      focus:ring-2 focus:ring-[#2D1B0D] outline-none text-sm md:text-base">
      </div>
      <select (change)="onBranchChange($event)"
              class="w-full sm:w-48 bg-white border border-gray-100 px-4 py-2.5 rounded-xl shadow-sm
                     text-sm md:text-base font-medium text-gray-600 outline-none">

        <option value="0">All Branches</option>

        @for(branch of branches; track branch.id){
          <option [value]="branch.id">{{branch.name}}</option>
        }

      </select>
    </div>
  </div>
</div>
