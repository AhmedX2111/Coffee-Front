<aside class="w-64 h-screen bg-[#2D1B0D] text-[#EAD8C3] flex flex-col p-4">
      <div class="flex items-center gap-3 mb-10 px-2">
        <div class="bg-[#EAD8C3] p-2 rounded-lg">
          <i class="ph-coffee text-[#2D1B0D] text-xl"></i>
        </div>
        <span class="text-xl font-bold">BrewMaster</span>
      </div>

      <nav class="flex-1 space-y-2">
        @for(menu of menuItems; track menu.label){
          <!--  [class.bg-[#FDF6E9]]="menu.active" 
             [class.text-[#2D1B0D]]="menu.active" 
              [class.hover:bg-[#FDF6E9]]="menu.active"-->
        <a
        [routerLink]="menu.link"
            routerLinkActive="bg-[#FDF6E9] text-[#2D1B0D]"
           
             class="flex items-center justify-between px-4 py-3 rounded-xl cursor-pointer hover:bg-[#3d2918] hover:text-[#FDF6E9] transition-all"
            >
          <div class="flex items-center gap-3">
            <i [class]="menu.icon + ' text-lg'"></i>
            <span class="font-medium">{{ menu.label }}</span>
          </div>
        </a>}
        @empty{
            <h1 class="text-danger">No Data Found</h1>
        }
      </nav>

      <div class="bg-[#3d2918] rounded-2xl p-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-[#EAD8C3] text-[#2D1B0D] flex items-center justify-center font-bold">
            AD
          </div>
          <div class="flex flex-row overflow-hidden">
            <div>
            <span class="text-sm font-semibold truncate">Super Admin</span>
            <!-- <span class="text-xs opacity-60 truncate">admin&#64;brewmaster.com</span> -->
            </div>
          <app-logout buttonClass="w-10 h-10 text-[#EAD8C3] hover:text-white bg-red-500/20 hover:bg-red-500 rounded-xl transition-all flex items-center justify-center" title="Logout">
          <span class="material-icons">logout</span>
        </app-logout>
          </div>
        </div>

      </div>
    </aside>
