<div class="p-6 min-h-screen bg-white">
  <div class="flex flex-col md:flex-row md:items-center justify-between mb-6 gap-4">
    <div class="flex items-center gap-3">
      <div class="bg-emerald-500 text-white p-2 rounded-full flex items-center justify-center">
        <span class="material-icons text-xl">check_circle</span>
      </div>
      <div>
        <h1 class="text-3xl font-bold text-primary">Completed Orders</h1>
        <p class="text-primary/70 text-sm">View your order history</p>
      </div>
    </div>
    <app-search-orders (searchChange)="getOrdersCompletedForOneBranchById($event)"></app-search-orders>
  </div>

  <app-orders-table [orders]="orders()"
                    [showCompleteButton]="false"
                    (viewOrder)="openModal($event)">
  </app-orders-table>
</div>

<app-order-details-modal [order]="selectedOrder()!" [isOpen]="isModalOpen()" [close]="closeModal">
</app-order-details-modal>
