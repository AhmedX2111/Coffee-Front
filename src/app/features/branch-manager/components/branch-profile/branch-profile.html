<div class="max-w-4xl mx-auto p-6">
  <div class="flex items-center gap-3 mb-6">
    <div class="bg-primary p-2 rounded-lg text-surface">
      <span class="material-icons">storefront</span>
    </div>
    <div>
      <h1 class="text-2xl font-bold leading-tight">Branch Profile</h1>
      <p class="text-sm text-primary/60">Manage your branch information</p>
    </div>
  </div>

  <div class="card bg-white">
    <div class="bg-primary h-32 relative flex justify-center items-center">
      <div class="absolute -bottom-10 bg-secondary rounded-full p-6 border-4 border-white shadow-sm">
        <span class="material-icons text-primary text-5xl">storefront</span>
      </div>
    </div>

    <div class="pt-16 pb-10 px-8 space-y-6">

      <div class="space-y-1">
        <label class="flex items-center gap-2 text-xs font-semibold text-primary/60 uppercase tracking-wider">
          <span class="material-icons text-sm">store</span> Branch Name
        </label>
        <div class="bg-surface p-4 rounded-xl text-primary font-medium border border-black/5">
          {{ branchData()?.name }}
        </div>
      </div>

      <div class="space-y-1">
        <label class="flex items-center gap-2 text-xs font-semibold text-primary/60 uppercase tracking-wider">
          <span class="material-icons text-sm">location_on</span> Address
        </label>
        <div class="bg-surface p-4 rounded-xl text-primary font-medium border border-black/5">
          {{ branchData()?.address }}
        </div>
      </div>
      <div class="space-y-1">
        <label class="flex items-center gap-2 text-xs font-semibold text-primary/60 uppercase tracking-wider">
          <span class="material-icons text-sm">call</span> Phone
        </label>
        <div class="bg-surface p-4 rounded-xl text-primary font-medium border border-black/5">
          {{ branchData()?.phone }}
        </div>
      </div>
    </div>
  </div>
  <app-branch-stats></app-branch-stats>
</div>
