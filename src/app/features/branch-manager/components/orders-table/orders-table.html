<div class="overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead class="bg-primary text-surface">
          <tr>
            <th class="px-6 py-4 font-semibold uppercase text-xs tracking-wider">Order ID</th>
            <th class="px-6 py-4 font-semibold uppercase text-xs tracking-wider">Total Price</th>
            <th class="px-6 py-4 font-semibold uppercase text-xs tracking-wider">Completed At</th>
            <th class="px-6 py-4 font-semibold uppercase text-xs tracking-wider text-center">Action</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-black/5">
          @for (order of orders; track order.id) {
            <tr class="hover:bg-secondary/10 transition-colors">
              <td class="px-6 py-4 font-medium">{{ order.orderNumber }}</td>
              <td class="px-6 py-4 font-semibold">{{ order.totalPrice }}</td>
              <td class="px-6 py-4 text-primary/80">{{ order.updatedAt | date:'medium' }}</td>
              <td class="px-6 py-4">
                <div class="flex justify-center gap-2">
                  <button class="btn-primary text-xs py-2 px-4 rounded-lg shadow-sm"
                          (click)="viewOrder.emit(order)">
                    <span class="material-icons text-sm">visibility</span>
                    View Details
                  </button>
                  @if (showCompleteButton) {
                    <button class="btn-primary text-xs py-2 px-4 rounded-lg shadow-sm"
                            (click)="completeOrder.emit(order)">
                      <span class="material-icons text-sm">check_circle</span>
                      Complete
                    </button>
                  }
                </div>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="4" class="px-6 py-8 text-center text-primary/60">
                No orders found
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
