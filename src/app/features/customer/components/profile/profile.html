<div class="py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-2xl mx-auto">
    <!-- Header -->
    <div class="mb-8">
      <h1 class="text-4xl font-bold text-primary mb-2">My Profile</h1>
      <p class="text-primary/60">Manage your account information</p>
    </div>

    <!-- Profile Card -->
    <div class="bg-surface rounded-lg border border-black/5 p-8">
      <!-- Avatar Section -->
      <div class="flex items-center gap-6 mb-8 pb-8 border-b border-black/5">
        <div class="w-20 h-20 bg-primary/10 rounded-full flex items-center justify-center">
          <span class="material-icons text-4xl text-primary">account_circle</span>
        </div>
        <div>
          <h2 class="text-2xl font-bold text-primary">{{ user().name }}</h2>
          <p class="text-primary/60">Member since {{ user().memberSince }}</p>
        </div>
      </div>

      <!-- Stats Grid -->
      <div class="grid grid-cols-2 gap-4 mb-8 pb-8 border-b border-black/5">
        <div class="bg-primary/5 rounded-lg p-4">
          <p class="text-primary/60 text-sm font-semibold mb-1">Total Orders</p>
          <p class="text-3xl font-bold text-primary">{{ user().totalOrders }}</p>
        </div>
        <div class="bg-primary/5 rounded-lg p-4">
          <p class="text-primary/60 text-sm font-semibold mb-1">Loyalty Points</p>
          <p class="text-3xl font-bold text-primary">{{ user().loyaltyPoints }}</p>
        </div>
      </div>

      <!-- Contact Information -->
      <div class="space-y-6 mb-8 pb-8 border-b border-black/5">
        <h3 class="text-lg font-semibold text-primary">Contact Information</h3>
        
        <div>
          <label class="text-sm font-semibold text-primary/60 block mb-2">Email</label>
          <p class="text-primary">{{ user().email }}</p>
        </div>

        <div>
          <label class="text-sm font-semibold text-primary/60 block mb-2">Phone</label>
          <p class="text-primary">{{ user().phone }}</p>
        </div>

        <div>
          <label class="text-sm font-semibold text-primary/60 block mb-2">Address</label>
          <p class="text-primary">{{ user().address }}</p>
        </div>
      </div>

      <!-- Actions -->
      <div class="flex gap-4">
        <button class="flex-1 px-6 py-3 bg-primary text-surface rounded-lg font-semibold hover:bg-primary/90 transition-colors">
          Edit Profile
        </button>
        <button class="flex-1 px-6 py-3 border border-primary/20 text-primary rounded-lg font-semibold hover:bg-primary/5 transition-colors">
          Change Password
        </button>
      </div>
    </div>

    <!-- Logout Button -->
    <button class="mt-6 w-full px-6 py-3 bg-red-50 text-red-600 rounded-lg font-semibold hover:bg-red-100 transition-colors">
      Logout
    </button>
  </div>
</div>
