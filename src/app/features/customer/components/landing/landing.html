<div class="space-y-24">
  <!-- Hero Section -->
  <section class="hero-section relative h-[80vh] min-h-[600px] flex items-center overflow-hidden rounded-3xl mx-4 sm:mx-6 lg:mx-8 mt-4">
    <div class="absolute inset-0 z-0">
      <img src="https://picsum.photos/seed/coffee-hero/1920/1080?blur=2" alt="Coffee Hero" class="w-full h-full object-cover brightness-50" referrerpolicy="no-referrer">
    </div>
    
    <div class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-surface">
      <div class="max-w-2xl space-y-8">
        <h1 class="text-6xl md:text-8xl font-display font-bold leading-tight">
          Crafting <span class="text-secondary">Perfect</span> Moments
        </h1>
        <p class="text-xl md:text-2xl text-surface/80 leading-relaxed">
          Experience the finest coffee and freshest bites in a warm, minimal space designed for your comfort.
        </p>
        <div class="flex flex-wrap gap-4 pt-4">
          <button (click)="navigateToMenu()" class="btn-secondary text-lg px-8 py-4 inline-flex items-center gap-2">
            Order Now
            <span class="material-icons">arrow_forward</span>
          </button>
          <button (click)="showTimePicker.set(true)" class="bg-surface/10 border border-surface/20 text-surface hover:bg-surface/20 text-lg px-8 py-4 rounded-xl font-semibold transition-all inline-flex items-center gap-2">
            Pre-order
          </button>
        </div>
      </div>
    </div>

    <!-- Time Picker Modal -->
    @if (showTimePicker()) {
      <div class="absolute inset-0 z-50 flex items-center justify-center bg-primary/40 backdrop-blur-sm">
        <div class="card p-8 max-w-md w-full mx-4 space-y-8">
          <div class="flex justify-between items-center">
            <h3 class="text-2xl font-display font-bold">Select Pre-order Time</h3>
            <button (click)="showTimePicker.set(false)" class="p-2 hover:bg-black/5 rounded-full transition-colors">
              <span class="material-icons">close</span>
            </button>
          </div>

          <div class="flex justify-center items-center gap-4">
            <div class="flex flex-col items-center gap-2">
              <span class="text-xs font-bold text-primary/40 uppercase">Hour</span>
              <select [(ngModel)]="selectedHour" class="bg-background border border-secondary rounded-xl px-4 py-3 text-2xl font-bold focus:outline-none focus:ring-2 focus:ring-primary/20">
                @for (h of hours; track h) {
                  <option [value]="h">{{ h }}</option>
                }
              </select>
            </div>
            <span class="text-3xl font-bold mt-6">:</span>
            <div class="flex flex-col items-center gap-2">
              <span class="text-xs font-bold text-primary/40 uppercase">Minute</span>
              <select [(ngModel)]="selectedMinute" class="bg-background border border-secondary rounded-xl px-4 py-3 text-2xl font-bold focus:outline-none focus:ring-2 focus:ring-primary/20">
                @for (m of minutes; track m) {
                  <option [value]="m">{{ m }}</option>
                }
              </select>
            </div>
            <div class="flex flex-col items-center gap-2">
              <span class="text-xs font-bold text-primary/40 uppercase">Period</span>
              <select [(ngModel)]="selectedPeriod" class="bg-background border border-secondary rounded-xl px-4 py-3 text-2xl font-bold focus:outline-none focus:ring-2 focus:ring-primary/20">
                <option value="AM">AM</option>
                <option value="PM">PM</option>
              </select>
            </div>
          </div>

          <button (click)="confirmPreOrder()" class="btn-primary w-full py-4 text-lg">
            Continue to Menu
          </button>
        </div>
      </div>
    }
  </section>

  <!-- Product Catalog -->
  <section id="featured" class="py-12">
    <app-product-catalog></app-product-catalog>
  </section>
</div>
